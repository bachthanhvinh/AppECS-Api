services:
  postgres:
    image: postgres:16-alpine
    container_name: ecs-data-project
    restart: unless-stopped

    ports:
      - "5440:5432"

    environment:
      POSTGRES_USER: Vinhdev
      POSTGRES_PASSWORD: Vinhmothaibabon
      POSTGRES_DB: ecs-data

    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
